<svg width="1200" height="190" viewBox="0 0 1200 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050E1F"/>
      <stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#FF4D6D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00D4FF" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="190" fill="url(#bg)"/>
  <rect width="1200" height="190" fill="url(#dots)"/>
  <ellipse cx="600" cy="95" rx="560" ry="110" fill="url(#glow)"/>

  <!-- Logo mark: network/graph icon, cyan + coral nodes (mirrors the skill-tree engineering/security color coding) -->
  <rect x="50" y="30" width="130" height="130" rx="20" fill="#0D1A2E" stroke="#00D4FF" stroke-opacity="0.28"/>
  <g transform="translate(75,53) scale(3.2)">
    <line x1="16" y1="9" x2="8" y2="23" stroke="#00D4FF" stroke-width="1.3"/>
    <line x1="16" y1="9" x2="24" y2="23" stroke="#00D4FF" stroke-width="1.3"/>
    <line x1="8" y1="23" x2="24" y2="23" stroke="#00D4FF" stroke-width="1.3" stroke-opacity="0.5"/>
    <circle cx="16" cy="9" r="3" fill="#00D4FF"/>
    <circle cx="8" cy="23" r="3.2" fill="#00D4FF"/>
    <circle cx="24" cy="23" r="3.2" fill="#FF4D6D"/>
  </g>

  <!-- Name -->
  <text x="220" y="80" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="0.5">
    <tspan fill="#F0F4FF">Athira </tspan><tspan fill="#00D4FF">Anil Kumar</tspan>
  </text>

  <!-- Role -->
  <text x="221" y="116" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#00D4FF">
    GenAI Security Testing Developer
  </text>

  <!-- Tagline -->
  <text x="221" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7A8BAA">
    Agentic AI &#183; LLM Security &#183; RAG Systems &#183; UAE
  </text>

  <text x="1150" y="170" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="12" fill="#7A8BAA">
    ara-5.github.io/Portfolio
  </text>

  <rect x="0" y="187" width="1200" height="3" fill="url(#accentBar)"/>
</svg>
